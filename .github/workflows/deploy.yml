name: Docker Build & Push

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Gate de vulnerabilidades. La gestion de vulnerabilidades es un area explicita del control
      # ADA-CASA, y hasta ahora las dependencias solo se miraban a mano. Corre antes de construir,
      # asi una dependencia vulnerable no llega a publicar la imagen.
      # `--package-lock-only` audita el lockfile sin instalar node_modules: segundos, no minutos.
      # Verificado en las dos direcciones: con una vulnerabilidad high en el lockfile sale con
      # codigo 1; con el lockfile actual, que tiene 0, sale con 0.
      - name: Audit dependencies for known vulnerabilities
        run: npm audit --package-lock-only --audit-level=high

      - name: Install dependencies
        run: npm ci

      # Los tests existen para que una regresion no llegue a la imagen. Si no corren aca, solo
      # corren cuando alguien se acuerda, que es lo mismo que no tenerlos.
      - name: Unit and invariant tests
        run: npm test

      - name: Component behaviour tests
        run: npm run test:ui

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_TELEMETRY_DISABLED=1
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Build and push Manager image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: manager
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:manager
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          build-args: |
            NEXT_TELEMETRY_DISABLED=1
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
