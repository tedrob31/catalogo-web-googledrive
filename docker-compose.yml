version: "3.7"
services:

## --------------------------- SAAS PLATFORM (Next.js Multi-Tenant) --------------------------- ##
  backend_api:
    image: ghcr.io/tedrob31/catalogo-web-googledrive:main
    build: 
      context: .
      dockerfile: Dockerfile
      target: manager
    networks:
      - r4tlabsnet
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      # Dominio Base de la Plataforma
      - NEXT_PUBLIC_BASE_DOMAIN=${NEXT_PUBLIC_BASE_DOMAIN:-c4talogo.com}
      - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME:-c4talogo_platform}

      # Supabase Cloud (Base de Datos & Auth Multi-Tenant)
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}

      # Cloudflare R2 (Almacenamiento Puro de Imágenes)
      - R2_ENDPOINT=${R2_ENDPOINT}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-c4talogo-media}
      - R2_PUBLIC_DOMAIN=${R2_PUBLIC_DOMAIN:-https://cdn.c4talogo.com}

      # Imgproxy (Procesamiento firmado HMAC-SHA256)
      - IMGPROXY_URL=${IMGPROXY_URL:-https://img.c4talogo.com}
      - IMGPROXY_KEY=${IMGPROXY_KEY}
      - IMGPROXY_SALT=${IMGPROXY_SALT}

      # Google OAuth 2.0 (Google Drive Integration)
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}

      # Cloudflare Cache Purge
      - CLOUDFLARE_ZONE_ID=${CLOUDFLARE_ZONE_ID:-}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}

      # Performance de Alta Concurrencia (VPS 6 Cores / 12GB RAM)
      - NODE_OPTIONS='--max-old-space-size=3584'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "4.0"
          memory: 4096M
      labels:
        - traefik.enable=true
        - traefik.docker.network=r4tlabsnet
        
        # Enrutamiento Wildcard para c4talogo.com, app.c4talogo.com y todos los subdominios (*.c4talogo.com)
        - "traefik.http.routers.r4t-c4talogo.rule=Host(`${NEXT_PUBLIC_BASE_DOMAIN:-c4talogo.com}`) || Host(`www.${NEXT_PUBLIC_BASE_DOMAIN:-c4talogo.com}`) || Host(`app.${NEXT_PUBLIC_BASE_DOMAIN:-c4talogo.com}`) || HostRegexp(`{subdomain:[a-z0-9-]+}.${NEXT_PUBLIC_BASE_DOMAIN:-c4talogo.com}`)"
        - "traefik.http.routers.r4t-c4talogo.priority=50000"
        - "traefik.http.routers.r4t-c4talogo.entrypoints=websecure"
        - "traefik.http.routers.r4t-c4talogo.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.r4t-c4talogo.service=backend_api-c4talogo"
        - "traefik.http.services.backend_api-c4talogo.loadbalancer.server.port=3000"

## --------------------------- REDES --------------------------- ##

networks:
  r4tlabsnet:
    external: true
    name: r4tlabsnet
